<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
     <!-- Style sheet -->
     <link rel="stylesheet" href="style.css">
    <!-- icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- google fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <div class="form-box Register">
            <form action="" id="form" novalidate>
                <h1 class="heading">Registration</h1>
                <div class="input-group">
                    <input type="text" id="username" placeholder="Username" required>
                    <i class="fa-solid fa-user" style="color: #888;"></i>
                    <div class="error"></div>
                </div>
                <div class="input-group">
                    <input type="email" id="email" placeholder="Email" required>
                    <i class="fa-solid fa-envelope" style="color: #888;"></i>
                    <div class="error"></div>
                </div>
                <div class="input-group">
                    <input type="password" placeholder="password" id="password" required>
                    <i class="fa-solid fa-lock" style="color: #888;"></i>
                    <div class="error"></div>
                </div>
                <div class="input-group">
                    <input type="password" id="cpassword" name="cpassword" placeholder="Confirm password">
                    <i class="fa-solid fa-lock" style="color: #888;"></i>
                    <div class="error"></div>
                </div>
                <button type="submit" class="Btn">Register</button>
                <p>or register with social platform</p>

                <!-- social media platform -->
                 <div class="sociamedia-icons">
                    <a href="#"><i class="fa-brands fa-google" style="color: #703b55;"></i></a>
                    <a href="#"><i class="fa-brands fa-facebook" style="color: #703b55;"></i></a>
                    <a href="#"><i class="fa-brands fa-linkedin" style="color: #703b55;"></i></a>
                    <a href="#"><i class="fa-brands fa-square-github" style="color: #703b55;"></i></a>
                 </div>
            </form>
        </div>

        <div class="success-message" id="successMessage"></div>

        <div class="toogle-box">
            <div class="toggle-panel toggle-left">
                <h1>Welcome to</h1>
                <h1>Our</h1>
                <h1>Website!</h1>
            </div>
        </div>
    </div>


    <script src="script.js"></script>
    
</body>
</html>
